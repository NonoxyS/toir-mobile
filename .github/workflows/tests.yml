name: Tests

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  kmp-tests:
    name: KMP Tests (iOS Simulator)
    runs-on: macos-latest
    # Compose Multiplatform 1.12.0-alpha01 ui-uikit references UIViewLayoutRegion
    # and auto-links UIUtilities (iOS 26 / Xcode 26 SDK). macos-latest ships Xcode 16.4
    # (iOS 18.5 SDK) — test executable link fails with undefined symbols.
    # Re-enable once Xcode 26 lands on hosted runners or Compose MP stable drops the deps.
    if: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin Native dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.konan/dependencies
            ~/.konan/kotlin-native-prebuilt-macos-*
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Run KMP tests on iOS Simulator
        run: ./gradlew iosSimulatorArm64Test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
